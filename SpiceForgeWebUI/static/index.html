<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpiceForge</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="icon-256.png" />
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // The stored theme, before the first paint, so a dark theme doesn't flash light (src/theme.ts takes over).
      try {
        var t = localStorage.getItem("spiceforge.theme");
        if (!t || t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="toolbar">
      <button id="about" class="brand" title="About SpiceForge">SpiceForge</button>
      <button id="new" disabled title="A new schematic, in a new tab">New</button>
      <button id="open" disabled title="Open a schematic (Ctrl+O)">Open…</button>
      <button id="save" disabled title="Save (Ctrl+S)">Save</button>
      <button id="save-as" disabled title="Save under a new name (Ctrl+Shift+S)">Save As…</button>
      <button id="export" disabled title="Save the drawing as an SVG or PNG image">Export…</button>
      <span class="separator"></span>
      <button id="undo" disabled title="Undo (Ctrl+Z)">Undo</button>
      <button id="redo" disabled title="Redo (Ctrl+Y)">Redo</button>
      <span class="separator"></span>
      <button id="cut" disabled title="Cut (Ctrl+X)">Cut</button>
      <button id="copy" disabled title="Copy (Ctrl+C)">Copy</button>
      <button id="paste" disabled title="Paste (Ctrl+V)">Paste</button>
      <button id="delete" disabled title="Delete (Del)">Delete</button>
      <span class="separator"></span>
      <button id="simulate" disabled title="Simulate this schematic (F5)">Simulate</button>
      <button id="audio" disabled title="The audio device: driver, channels, rate and buffer size, and a test">Audio…</button>
    </header>
    <nav id="tabs" class="tabs"></nav>
    <div id="banner" class="banner" hidden></div>
    <div class="workspace">
      <aside id="library" class="panel library"></aside>
      <main class="canvas">
        <div id="find" class="find" hidden>
          <input id="find-text" type="search" placeholder="Find a part by name" spellcheck="false" />
          <span id="find-count" class="find-count"></span>
          <button id="find-close" title="Close (Esc)">×</button>
        </div>
        <svg id="schematic" xmlns="http://www.w3.org/2000/svg" tabindex="0" data-tool="select">
          <g id="drawing"></g>
          <g id="overlay"></g>
          <g id="probes"></g>
        </svg>
      </main>
      <aside id="properties" class="panel properties">
        <!-- The view: zoom and theme, above the properties (PropertiesPanel appends its own after). -->
        <section class="view-section">
          <div class="panel-title">View</div>
          <div class="view-row">
            <button id="zoom-out" title="Zoom out (−)">−</button>
            <span id="zoom" class="zoom">100%</span>
            <button id="zoom-in" title="Zoom in (+)">+</button>
            <button id="fit" title="Zoom to fit (F)">Fit</button>
          </div>
          <label class="view-row theme" title="The colour theme">Theme <select id="theme"></select></label>
        </section>
      </aside>
    </div>
    <section id="sim" class="sim" hidden></section>
    <footer class="statusbar">
      <span id="status">Connecting…</span>
      <span id="tool" class="tool"></span>
      <span id="selection" class="selection"></span>
      <span id="pointer" class="pointer"></span>
    </footer>
    <div id="menu" class="menu" hidden></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
