<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpiceForge</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="toolbar">
      <span class="brand">SpiceForge</span>
      <button id="new" disabled title="A new schematic, in a new tab">New</button>
      <button id="open" disabled title="Open a schematic (Ctrl+O)">Open…</button>
      <button id="save" disabled title="Save (Ctrl+S)">Save</button>
      <button id="save-as" disabled title="Save under a new name (Ctrl+Shift+S)">Save As…</button>
      <span class="separator"></span>
      <button id="undo" disabled title="Undo (Ctrl+Z)">Undo</button>
      <button id="redo" disabled title="Redo (Ctrl+Y)">Redo</button>
      <span class="separator"></span>
      <button id="cut" disabled title="Cut (Ctrl+X)">Cut</button>
      <button id="copy" disabled title="Copy (Ctrl+C)">Copy</button>
      <button id="paste" disabled title="Paste (Ctrl+V)">Paste</button>
      <button id="delete" disabled title="Delete (Del)">Delete</button>
      <span class="separator"></span>
      <button id="wire" disabled title="Draw wires (W)">Wire</button>
      <span class="separator"></span>
      <button id="zoom-out" title="Zoom out (−)">−</button>
      <span id="zoom" class="zoom">100%</span>
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <button id="fit" title="Zoom to fit (F)">Fit</button>
    </header>
    <nav id="tabs" class="tabs"></nav>
    <div id="banner" class="banner" hidden></div>
    <div class="workspace">
      <aside id="library" class="panel library"></aside>
      <main class="canvas">
        <svg id="schematic" xmlns="http://www.w3.org/2000/svg" tabindex="0" data-tool="select">
          <g id="drawing"></g>
          <g id="overlay"></g>
        </svg>
      </main>
      <aside id="properties" class="panel properties"></aside>
    </div>
    <footer class="statusbar">
      <span id="status">Connecting…</span>
      <span id="tool" class="tool"></span>
      <span id="selection" class="selection"></span>
      <span id="pointer" class="pointer"></span>
    </footer>
    <div id="menu" class="menu" hidden></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
