# Builds SpiceForge and runs its checks: on pull requests, and by hand (Actions > Build > Run workflow). It also builds
# the packages (the Windows installer and zip, the Linux tarball, each with the plugin as CLAP and VST3) and attaches
# them to the run as artifacts, versioned from git tags as development builds (0.0.2-dev.10, say): for trying a change
# before it's released.
name: Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole solution, the plugin and its standalone host included (the plugin's CLAP and VST3 bundles are the
  # Packages job's, with AudioPlugSharp's native adapters).
  solution:
    name: Solution (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build SpiceForge.slnx -c Release

  # The server and its editor, checked on both platforms: the JSON document round trip, every operation against a
  # running server (audio on the internal clock), simulation against the processor run offline, and the web editor's
  # connectivity against the server's (its conformance test).
  server:
    name: Server checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SpiceForgeWebUI/package-lock.json
      - name: Build the web editor
        working-directory: SpiceForgeWebUI
        run: |
          npm ci
          npm run build
      - name: Build the server and the checks
        run: |
          dotnet build SpiceForgeServer -c Release
          dotnet build SpiceForge.Validate -c Release
      - name: SpiceForge.Validate server
        run: dotnet run --project SpiceForge.Validate -c Release --no-build -- server

  # The plugin's adapters for Linux, which the Packages job can't build on Windows.
  linux-adapters:
    uses: ./.github/workflows/linux-adapters.yml

  # The packages, as the Release workflow builds them, attached to the run. On Windows, which builds all three: Inno
  # Setup is Windows only, and the Linux tarball is written with its permissions set wherever it's made.
  packages:
    name: Packages
    needs: linux-adapters
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The whole history and the tags, which the version is worked out from.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SpiceForgeWebUI/package-lock.json
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build the web editor
        working-directory: SpiceForgeWebUI
        run: |
          npm ci
          npm run build
      # The plugin's Linux adapters, from the Linux adapters job; the Windows ones the packaging builds itself.
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: SpiceForgePlugin/Dependencies/AudioPlugSharp/AudioPlugSharpBridge/bin/native/linux-x64
      - name: Build the packages
        run: dotnet run -c Release --project SpiceForge.Package -- --skipWeb --requireInstaller --requirePlugins
      # One artifact each, so one can be downloaded without the others.
      - uses: actions/upload-artifact@v4
        with:
          name: SpiceForge-setup
          path: artifacts/SpiceForge-*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: SpiceForge-win-x64
          path: artifacts/SpiceForge-*-win-x64.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: SpiceForge-linux-x64
          path: artifacts/SpiceForge-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The processor against the compiled engine it wraps, on every test circuit.
  processor:
    name: Processor checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build SpiceForge.Validate -c Release
      - name: SpiceForge.Validate processor
        run: dotnet run --project SpiceForge.Validate -c Release --no-build -- processor
