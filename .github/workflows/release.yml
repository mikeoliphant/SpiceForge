# Makes a release, by hand (Actions > Release > Run workflow, with a version): tags this commit v<version>, checks the
# server, builds the packages (the Windows installer and zip, the Linux tarball), pushes the tag, and creates a draft
# GitHub release on it, with the packages attached and no notes. Write the notes and publish it on GitHub.
#
# The tag is the version's one source: everything built here reads it back from git (the server project's
# SpiceForgeGitVersion target), as development builds do. It's pushed only once the packages are built, so a failed
# run leaves nothing behind. Running again with the same version, after deleting its draft, reuses the tag if it's on
# this commit and moves it here if not; a published release's tag is never moved.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without the v (0.2.0)"
        required: true
      prerelease:
        description: "Mark it a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check the version, and tag this commit
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "The version '$env:VERSION' isn't like 0.2.0 (or 0.2.0-beta.1)." }
          $tag = "v$env:VERSION"
          # A published release is final; a draft (gh release view finds drafts) is deleted by hand before a rerun, so
          # its notes aren't lost to one.
          $release = gh release view $tag --json isDraft 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0 -and $release) {
            if ($release.isDraft) { throw "There's a draft release $tag. Delete it on GitHub, then run this again." }
            throw "$tag is already released."
          }
          # Only here, for now: the tag is pushed once the packages are built.
          $existing = git rev-parse -q --verify "refs/tags/$tag^{commit}"
          if ($existing -eq $env:GITHUB_SHA) { Write-Output "$tag is already on this commit: reusing it." }
          elseif ($existing) { Write-Output "$tag is on $existing, unreleased: moving it to $env:GITHUB_SHA."; git tag -f $tag $env:GITHUB_SHA }
          else { git tag $tag $env:GITHUB_SHA }
          $global:LASTEXITCODE = 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The build reads the version back from the tag; make sure it reads the one asked for (another tag on this
      # commit, say, would win).
      - name: Check the version the build will use
        shell: pwsh
        run: |
          $built = (dotnet msbuild SpiceForgeServer/SpiceForgeServer.csproj -nologo -target:SpiceForgeGitVersion -getProperty:Version).Trim()
          if ($built -ne $env:VERSION) { throw "The build would be version '$built', not '$env:VERSION'." }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SpiceForgeWebUI/package-lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build the web editor
        working-directory: SpiceForgeWebUI
        run: |
          npm ci
          npm run build

      # A release only of a build that passes the server's checks.
      - name: SpiceForge.Validate server
        run: |
          dotnet build SpiceForgeServer -c Release
          dotnet build SpiceForge.Validate -c Release
          dotnet run --project SpiceForge.Validate -c Release --no-build -- server

      - name: Build the packages
        run: dotnet run -c Release --project SpiceForge.Package -- --skipWeb --requireInstaller

      - name: Push the tag and create the release
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts -File | Where-Object { $_.Name -like "SpiceForge-$env:VERSION*" } | ForEach-Object { $_.FullName }
          if ($assets.Count -ne 3) { throw "Expected 3 packages, found: $($assets -join ', ')" }
          # Forced, to move an unreleased tag from an earlier run (checked above).
          git push --force origin "refs/tags/v$env:VERSION"
          $flags = @()
          if ("${{ inputs.prerelease }}" -eq "true") { $flags += "--prerelease" }
          gh release create "v$env:VERSION" @assets --verify-tag --title "SpiceForge $env:VERSION" --draft --notes "" @flags
