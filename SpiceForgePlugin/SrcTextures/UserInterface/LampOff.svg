<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="-12 -12 88 88">
  <!-- An unlit green lamp, in the style of Stompbox's PowerOff: dark green, with the same black rim and soft
       edge as LampOn. -->
