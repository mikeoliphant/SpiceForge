<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="-12 -12 88 88">
  <!-- A lit green lamp, in the style of Stompbox's PowerOn: flat green in the middle, darkening to a black rim
       with a soft edge. The same size and position as LampOff, so a switch doesn't move when it toggles. -->
  <defs>
    <radialGradient id="lamp" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4cd644"/>
      <stop offset="0.21" stop-color="#4cd644"/>
      <stop offset="0.29" stop-color="#48d341"/>
      <stop offset="0.43" stop-color="#3ec837"/>
      <stop offset="0.57" stop-color="#2ab222"/>
      <stop offset="0.71" stop-color="#178310"/>
      <stop offset="0.79" stop-color="#0b5607"/>
      <stop offset="0.857" stop-color="#032d02" stop-opacity="0.97"/>
      <stop offset="0.893" stop-color="#021f01" stop-opacity="0.89"/>
      <stop offset="0.929" stop-color="#011500" stop-opacity="0.67"/>
      <stop offset="0.964" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#lamp)"/>
</svg>
